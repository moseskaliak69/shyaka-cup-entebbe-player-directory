<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shyaka Cup Entebbe — Player Directory</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f5f7;color:#17212b}
header{background:#071b35;color:#fff;padding:30px 18px;text-align:center;border-bottom:5px solid #d39a28}
header h1{margin:0;font-size:30px;letter-spacing:.5px}
header p{margin:8px 0 0;opacity:.9}
.wrap{max-width:1200px;margin:24px auto;padding:0 16px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 3px 12px #0001;font-weight:700}
.controls{background:#fff;padding:16px;border-radius:14px;box-shadow:0 3px 12px #0001;margin-bottom:20px;display:grid;grid-template-columns:2fr 1fr;gap:12px}
input,select{width:100%;padding:12px;border:1px solid #d8dee5;border-radius:9px;font-size:15px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 4px 16px #00000012}
.photo{width:100%;height:250px;object-fit:cover;background:#e8ebee}
.info{padding:14px 15px 16px}
.name{font-size:18px;font-weight:700;margin-bottom:7px}
.meta{font-size:14px;color:#5d6973;line-height:1.6}
.button{display:inline-block;margin-top:12px;padding:9px 12px;border-radius:8px;background:#071b35;color:#fff;text-decoration:none;font-size:13px;font-weight:700;border:0;cursor:pointer}.adminbar{display:flex;justify-content:flex-end;margin-bottom:12px}.adminbtn{background:#d39a28;color:#071b35;border:0;padding:10px 15px;border-radius:9px;font-weight:800;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:20px;overflow:auto}.modal.show{display:flex;align-items:center;justify-content:center}.panel{background:#fff;width:min(680px,100%);border-radius:16px;padding:22px;box-shadow:0 12px 40px #0004}.panel h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field.full{grid-column:1/-1}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.secondary{background:#eef1f4;color:#17212b}.danger{background:#9d2525}.notice{font-size:13px;color:#697681;background:#f6f7f8;padding:10px;border-radius:9px;margin-bottom:14px}@media(max-width:700px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
.empty{display:none;text-align:center;background:#fff;border-radius:14px;padding:45px;color:#697681}
footer{text-align:center;padding:30px;color:#7b8790;font-size:13px}
@media(max-width:700px){.controls{grid-template-columns:1fr}header h1{font-size:24px}.photo{height:230px}}
</style>
</head>
<body>
<header>
<h1>SHYAKA CUP ENTEBBE</h1>
<p>Official Player Directory</p>
</header>
<div class="wrap">
<div class="adminbar"><button class="adminbtn" id="adminOpen">⚙ Add / Manage Players</button></div>
<div class="stats">
<div class="stat" id="totalStat"></div>
<div class="stat" id="villageStat"></div>
</div>
<div class="controls">
<input id="search" type="search" placeholder="Search player name or player number...">
<select id="village"><option value="">All villages</option></select>
</div>
<div id="players" class="grid"></div>
<div id="empty" class="empty">No players found.</div>
</div>

<div class="modal" id="adminModal">
  <div class="panel">
    <h2>Player Management</h2>
    <div class="notice">Players added here are saved to the shared online Shyaka Cup database. After saving, everyone who opens the directory can see the new player.</div>
    <div class="formgrid">
      <div class="field"><label>Player Name</label><input id="fName" placeholder="Full name"></div>
      <div class="field"><label>Player Number</label><input id="fNumber" placeholder="e.g. BKIWV01"></div>
      <div class="field"><label>Parish</label><input id="fParish" value="Kiwafu"></div>
      <div class="field"><label>Village</label><input id="fVillage" placeholder="Village name"></div>
      <div class="field full"><label>Player Photo</label><input id="fPhoto" type="file" accept="image/*"></div>
      <div class="field full"><label>Player Licence</label><input id="fLicense" type="file" accept="image/*,.pdf"></div>
    </div>
    <div class="actions">
      <button class="button secondary" id="adminClose">Close</button>
      <button class="button" id="exportData">Export Players</button>
      <button class="button" id="addPlayer">Add Player</button>
    </div>
  </div>
</div>
<footer>Shyaka Cup Entebbe • Player Directory</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

let storedPlayers = [];
let remotePlayers = [];
let supabaseClient = null;
try {
  if (window.SHYAKA_SUPABASE_URL && window.SHYAKA_SUPABASE_ANON_KEY && !window.SHYAKA_SUPABASE_URL.includes('YOUR_')) {
    supabaseClient = window.supabase.createClient(window.SHYAKA_SUPABASE_URL, window.SHYAKA_SUPABASE_ANON_KEY);
  }
} catch(e) { console.warn('Supabase not configured', e); }
try { storedPlayers = JSON.parse(localStorage.getItem('shyaka_players') || '[]'); } catch(e) {}
let ALL_PLAYERS = [...PLAYERS, ...storedPlayers.filter(sp => !PLAYERS.some(p => p.number === sp.number))];
const grid = document.getElementById('players');
const empty = document.getElementById('empty');
const search = document.getElementById('search');
const village = document.getElementById('village');

function refreshVillageOptions(){
  const current = village.value;
  village.innerHTML='<option value="">All villages</option>';
  [...new Set(ALL_PLAYERS.map(p => p.village))].sort().forEach(v => {
    const o=document.createElement('option'); o.value=v; o.textContent=v; village.appendChild(o);
  });
  village.value=current;
}
function updateStats(){
  document.getElementById('totalStat').textContent = `${ALL_PLAYERS.length} Players`;
  document.getElementById('villageStat').textContent = `${new Set(ALL_PLAYERS.map(p=>p.village)).size} Villages`;
}
function render() {
  const q = search.value.toLowerCase().trim(); const v = village.value;
  const list = ALL_PLAYERS.filter(p => (!v || p.village === v) && (`${p.name} ${p.number} ${p.village}`.toLowerCase().includes(q)));
  grid.innerHTML=''; empty.style.display=list.length?'none':'block';
  list.forEach(p => {
    const card=document.createElement('article'); card.className='card';
    card.innerHTML=`<img class="photo" src="${p.photo || ''}" alt="${p.name}" onerror="this.style.visibility='hidden'">
      <div class="info"><div class="name">${escapeHtml(p.name)}</div><div class="meta"><strong>Village:</strong> ${escapeHtml(p.village)}<br><strong>Parish:</strong> ${escapeHtml(p.parish||'')}<br><strong>Player No.:</strong> ${escapeHtml(p.number)}</div>
      ${p.license ? `<a class="button" href="${p.license}" target="_blank" rel="noopener">View License</a>` : ''}</div>`;
    grid.appendChild(card);
  });
}
function escapeHtml(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
search.addEventListener('input', render); village.addEventListener('change', render);
refreshVillageOptions(); updateStats(); render();

async function loadRemotePlayers(){
  if(!supabaseClient) return;
  const {data,error}=await supabaseClient
    .from('players')
    .select('id,name,player_number,parish,village_id,photo_url,licence_url,created_at,villages(name)')
    .order('created_at',{ascending:true});
  if(error){console.warn('Online player load failed:',error); return;}
  remotePlayers=(data||[]).map(p=>({
    name:p.name,
    number:p.player_number,
    parish:p.parish||'',
    village:p.villages?.name||'Unknown Village',
    photo:p.photo_url||'',
    license:p.licence_url||''
  }));
  ALL_PLAYERS=[...PLAYERS,...remotePlayers.filter(r=>!PLAYERS.some(p=>p.number===r.number))];
  refreshVillageOptions(); updateStats(); render();
}
loadRemotePlayers();

const adminModal=document.getElementById('adminModal');
document.getElementById('adminOpen').onclick=async()=>{
  if(supabaseClient){
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){
      const email=prompt('Admin email:'); if(!email) return;
      const password=prompt('Admin password:'); if(!password) return;
      const {error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error){alert('Login failed: '+error.message); return;}
    }
  }
  adminModal.classList.add('show');
};
document.getElementById('adminClose').onclick=()=>adminModal.classList.remove('show');
function readFile(file){return new Promise((resolve,reject)=>{if(!file){resolve(null);return;}const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
async function uploadFile(file,folder){
  if(!file || !supabaseClient) return null;
  const safe=(file.name||'file').replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=`${folder}/${Date.now()}_${safe}`;
  const {error}=await supabaseClient.storage.from('player-files').upload(path,file,{upsert:false});
  if(error) throw error;
  const {data}=supabaseClient.storage.from('player-files').getPublicUrl(path);
  return data.publicUrl;
}
document.getElementById('addPlayer').onclick=async()=>{
  const name=fName.value.trim(), number=fNumber.value.trim(), parish=fParish.value.trim(), vill=fVillage.value.trim();
  if(!name||!number||!vill){alert('Please enter player name, player number and village.');return;}
  if(ALL_PLAYERS.some(p=>p.number.toLowerCase()===number.toLowerCase())){alert('That player number already exists.');return;}
  const photoFile=fPhoto.files[0], licenseFile=fLicense.files[0];
  try{
    if(supabaseClient){
      const {data:{session}}=await supabaseClient.auth.getSession(); if(!session){alert('Please log in as an admin first.');return;}
      const {data:villageRow,error:villageError}=await supabaseClient.from('villages').select('id,name').ilike('name',vill).maybeSingle();
      if(villageError) throw villageError;
      if(!villageRow){alert('Village not found. Please add this village in Supabase first.');return;}
      const photoUrl=await uploadFile(photoFile,'photos');
      const licenseUrl=await uploadFile(licenseFile,'licenses');
      const {error}=await supabaseClient.from('players').insert({name,player_number:number,parish,village_id:villageRow.id,photo_url:photoUrl,licence_url:licenseUrl});
      if(error) throw error;
      alert('Player added online successfully. Everyone scanning the QR code will see the player.');
      fName.value='';fNumber.value='';fVillage.value='';fPhoto.value='';fLicense.value='';
      await loadRemotePlayers();
    } else {
      const photo=await readFile(photoFile), license=await readFile(licenseFile);
      const player={name,number,parish,village:vill,photo,license}; storedPlayers.push(player); localStorage.setItem('shyaka_players',JSON.stringify(storedPlayers));
      alert('Saved on this device only. Add Supabase configuration to make it shared online.'); location.reload();
    }
  }catch(err){console.error(err);alert('Could not add player: '+(err.message||err));}
};
document.getElementById('exportData').onclick=()=>{const blob=new Blob([JSON.stringify(ALL_PLAYERS,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shyaka-cup-players.json';a.click();URL.revokeObjectURL(a.href);};
</script>
